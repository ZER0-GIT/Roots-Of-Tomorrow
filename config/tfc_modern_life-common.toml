	[automation.firmalifeJarringStation]
		#允许自动化输入 FirmaLife 装罐台的物品: 物品 id（如 'minecraft:apple'）或物品标签（如 '#tfc:empty_jar_with_lid'）。
		#Items or item tags allowed to be inserted into FirmaLife jarring stations by automation. Use item ids like 'minecraft:apple' or tags like '#tfc:empty_jar_with_lid'.
		insertWhitelist = ["tfc:empty_jar_with_lid"]
		#禁止自动化从 FirmaLife 装罐台抽出的物品: 物品 id 或物品标签（如 '#tfc:empty_jar_with_lid'）。
		#Items or item tags blocked from automation extraction from FirmaLife jarring stations. Use item ids like 'minecraft:apple' or tags like '#tfc:empty_jar_with_lid'.
		extractBlacklist = ["#tfc:empty_jar_with_lid"]

	[power.electricKitchen]
		#电热烤箱通电时每 tick 消耗的 FE。设为 0 则烤箱加热不耗电。
		#FE consumed per tick while the Electric Oven is powered. Set to 0 to make oven heating free.
		# Default: 20
		# Range: 0 ~ 1000000
		electricOvenEnergyPerTick = 20
		#电热高压锅通电时每 tick 消耗的 FE。设为 0 则该设备加热不耗电。
		#FE consumed per tick while the Electric Soup Pot is powered. Set to 0 to make pot heating free.
		# Default: 20
		# Range: 0 ~ 1000000
		electricSoupPotEnergyPerTick = 20

	[climateControl.greenhouse]
		#FirmaLife 温室检测半径的倍率。
		#Multiplier applied to FirmaLife greenhouse search radius.
		# Default: 3.0
		# Range: 0.1 ~ 16.0
		greenhouseRadiusMultiplier = 3.0
		#保温温室墙规则。格式: 方块或标签=firmalife等级[,温室等级]。温室等级可选值: wood, copper, iron, stainless_steel。
		#Insulated greenhouse wall rules. Format: block_or_tag=firmalifeTier[,greenhouseTier]. greenhouseTier values: wood, copper, iron, stainless_steel.
		greenhouseThermalWalls = ["#firmalife:all_treated_wood_greenhouse=5,wood", "#firmalife:all_copper_greenhouse=10,copper", "#firmalife:all_iron_greenhouse=15,iron", "#firmalife:stainless_steel_greenhouse=20,stainless_steel"]
		#只用于密封温室、不提供保温等级的方块或标签。
		#Blocks or tags that seal greenhouses but do not provide a tier.
		greenhouseSealOnlyWalls = ["tfc_modern_life:thermostatic_air_conditioner", "tfc_modern_life:refrigerator", "immersiveengineering:capacitor_lv", "immersiveengineering:capacitor_mv", "immersiveengineering:capacitor_hv"]
		#无需坚固面检测即可密封温室的方块或标签。
		#Blocks or tags that can seal a greenhouse without a sturdy-face check.
		greenhouseAlwaysValidWalls = ["#firmalife:always_valid_greenhouse_wall", "#minecraft:doors", "#minecraft:trapdoors"]
		#混合温室中保温墙所占的最低比例。
		#Minimum insulated shell coverage for a mixed greenhouse.
		# Default: 0.95
		# Range: 0.0 ~ 1.0
		greenhouseMinimumThermalCoverage = 0.95
		#保温温室墙的最少方块数量。
		#Minimum insulated greenhouse shell blocks.
		# Default: 8
		# Range: 0 ~ 65536
		greenhouseMinimumThermalBlocks = 8
		#混合温室等级的计算方式: weighted_average（加权平均）, minimum（取最低）, maximum（取最高）。
		#How mixed greenhouse walls resolve tier: weighted_average, minimum, maximum.
		greenhouseTierMode = "weighted_average"

	[climateControl.cellar]
		#FirmaLife 地窖检测半径的倍率。
		#Multiplier applied to FirmaLife cellar search radius.
		# Default: 2.0
		# Range: 0.1 ~ 16.0
		cellarRadiusMultiplier = 2.0
		#保温地窖墙规则。格式: 方块或标签=sealed_brick|stainless_steel_reinforced。
		#Insulated cellar wall rules. Format: block_or_tag=sealed_brick|stainless_steel_reinforced.
		cellarThermalWalls = ["#firmalife:cellar_insulation=sealed_brick", "#tfc_modern_life:stainless_steel_reinforced_cellar=stainless_steel_reinforced"]
		#只用于密封地窖、不提供保温等级的方块或标签。
		#Blocks or tags that seal cellars but do not provide a tier.
		cellarSealOnlyWalls = ["tfc_modern_life:thermostatic_air_conditioner", "tfc_modern_life:refrigerator", "immersiveengineering:capacitor_lv", "immersiveengineering:capacitor_mv", "immersiveengineering:capacitor_hv"]
		#可以享受地窖保鲜的容器方块 id 或方块标签（如 'minecraft:chest'、'#tfc:fired_large_vessels'）。
		#Block ids or block tags whose inventories may receive temporary cellar preservation. Use block ids like 'minecraft:chest' or tags like '#tfc:fired_large_vessels'.
		cellarPreservableContainers = ["minecraft:chest", "minecraft:trapped_chest", "#c:chests/wooden", "#forge:chests/wooden", "#tfc:fired_large_vessels", "tfc:placed_item", "immersiveengineering:crate", "immersiveengineering:reinforced_crate"]
		#放在地窖保鲜容器里、需要连内部物品一起同步保鲜的物品容器 id 或物品标签（如 'tfc:ceramic/vessel'、'#tfc:fired_vessels'）。
		#Item ids or item tags for item containers whose internal slots should be checked when the item is inside a cellar-preservable container. Use item ids like 'tfc:ceramic/vessel' or tags like '#tfc:fired_vessels'.
		cellarNestedItemContainers = ["#tfc:fired_vessels"]
		#地窖中保温墙所占的最低比例。
		#Minimum insulated shell coverage for a cellar.
		# Default: 0.95
		# Range: 0.0 ~ 1.0
		cellarMinimumThermalCoverage = 0.95

	[climateControl.power]
		#恒温空调与制冷器在需要控温时消耗的最低 FE/t。设为 0 则取消最低耗能。
		#Minimum FE/t consumed by Thermostatic Air Conditioners and Refrigerators when active climate control is needed. Set to 0 to disable the minimum.
		# Default: 20
		# Range: 0 ~ 1000000
		climateControlMinEnergyUse = 20
		#恒温空调与制冷器的耗能系数: FE/t = round(有效空间 * 等级耗电倍率 * 温差 * 本值)。
		#Constant used by Thermostatic Air Conditioners and Refrigerators: FE/t = round(effectiveSpace * tierPowerMultiplier * temperatureDelta * this value).
		# Default: 0.001
		# Range: 0.0 ~ 1000.0
		climateControlEnergyUseScale = 0.001
		#木质（防腐木）温室的耗电倍率。
		#Power multiplier for treated wood greenhouse climate control.
		# Default: 1.3
		# Range: 0.0 ~ 1000.0
		greenhouseWoodPowerMultiplier = 1.3
		#铜质温室的耗电倍率。
		#Power multiplier for copper greenhouse climate control.
		# Default: 1.2
		# Range: 0.0 ~ 1000.0
		greenhouseCopperPowerMultiplier = 1.2
		#铁质温室的耗电倍率。
		#Power multiplier for iron greenhouse climate control.
		# Default: 1.1
		# Range: 0.0 ~ 1000.0
		greenhouseIronPowerMultiplier = 1.1
		#不锈钢温室的耗电倍率。
		#Power multiplier for stainless steel greenhouse climate control.
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		greenhouseStainlessSteelPowerMultiplier = 1.0
		#密封砖冷库的耗电倍率。
		#Power multiplier for sealed brick cold storage climate control.
		# Default: 1.1
		# Range: 0.0 ~ 1000.0
		cellarSealedBrickPowerMultiplier = 1.1
		#不锈钢强化冷库的耗电倍率。
		#Power multiplier for stainless steel reinforced cold storage climate control.
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		cellarStainlessSteelReinforcedPowerMultiplier = 1.0
